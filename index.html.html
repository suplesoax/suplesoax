<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>SuplesOax — Registro</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#080808;color:#fff}
body{display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(520px,100%);text-align:center;padding:34px 24px;border-radius:24px;background:linear-gradient(145deg,#151515,#090909);border:1px solid #2d2d2d;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.logo{font-weight:900;font-size:38px;letter-spacing:1px;margin-bottom:8px}
.logo span{color:#e50914}
h1{font-size:25px;margin:12px 0 10px}
p{color:#cfcfcf;line-height:1.5;margin:0 auto 25px;max-width:410px}
.btn{display:block;text-decoration:none;background:#e50914;color:#fff;font-size:19px;font-weight:900;padding:17px 18px;border-radius:14px;box-shadow:0 8px 24px rgba(229,9,20,.28)}
.btn:active{transform:scale(.98)}
.note{font-size:13px;color:#999;margin-top:18px}
</style>
</head>
<body>
<main class="card">
  <div class="logo">SUPLES<span>OAX</span></div>
  <h1>🔥 Entra al registro del sorteo</h1>
  <p>Ya estás a un paso de participar. Toca el botón para abrir el registro.</p>
  <a class="btn" href="https://script.google.com/macros/s/AKfycbxgcK1deks_X6gAxuqB5BmMPERNDkcirxk-UPk6EpIM5vcpYJUdrnvcriHLLABKpXBZ/exec" target="_blank" rel="noopener">ABRIR REGISTRO</a>
  <div class="note">Si Instagram no abre el registro directamente, toca el botón una vez más.</div>
</main>
</body>
</html>

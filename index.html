<!doctype html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#080808">

  <title>SuplesOax — Registro</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      min-height: 100%;

      font-family: Arial, Helvetica, sans-serif;

      background: #080808;

      color: #fff;

    }


    body {

      padding: 18px 12px;

    }


    .wrap {

      width: min(720px, 100%);

      margin: 0 auto;

    }


    .header {

      text-align: center;

      padding: 12px 10px 18px;

    }


    .logo {

      font-weight: 900;

      font-size: 38px;

      letter-spacing: 1px;

      margin-bottom: 8px;

    }


    .logo span {

      color: #e50914;

    }


    .title {

      font-size: 24px;

      font-weight: 800;

      margin-bottom: 6px;

    }


    .subtitle {

      color: #bdbdbd;

      font-size: 15px;

    }


    .form-box {

      width: 100%;

      background: #fff;

      border-radius: 18px;

      overflow: hidden;

      box-shadow: 0 18px 50px rgba(0,0,0,.55);

    }


    iframe {

      display: block;

      width: 100%;

      height: 1600px;

      border: 0;

      background: #fff;

    }


    .note {

      text-align: center;

      color: #888;

      font-size: 12px;

      line-height: 1.4;

      padding: 16px 10px 8px;

    }


    @media (max-width: 600px) {

      body {

        padding: 0;

      }


      .header {

        padding: 18px 12px;

      }


      .logo {

        font-size: 34px;

      }


      .title {

        font-size: 22px;

      }


      .form-box {

        border-radius: 0;

      }


      iframe {

        height: 1600px;

      }

    }

  </style>

</head>


<body>


  <main class="wrap">


    <header class="header">

      <div class="logo">
        SUPLES<span>OAX</span>
      </div>

      <div class="title">
        🔥 Registro del sorteo
      </div>

      <div class="subtitle">
        Completa tu registro aquí
      </div>

    </header>


    <section class="form-box">

      <iframe
        src="https://script.google.com/macros/s/AKfycbxgcK1deks_X6gAxuqB5BmMPERNDkcirxk-UPk6EpIM5vcpYJUdrnvcriHLLABKpXBZ/exec"
        title="Registro SuplesOax"
        allow="camera">
      </iframe>

    </section>


    <div class="note">
      Completa todos los datos solicitados para finalizar tu registro.
    </div>


  </main>


</body>

</html>
